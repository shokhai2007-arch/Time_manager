name: time_management
description: "A time management application with Neumorphic design."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_neumorphic_plus: ^3.2.0
  vibration: ^3.1.8
  percent_indicator: ^4.2.3
  flutter_riverpod: ^2.5.1
  package_info_plus: ^9.0.1
  http: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
