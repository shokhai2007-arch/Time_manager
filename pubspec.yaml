    sdk: flutter

  cupertino_icons: ^1.0.6
  flutter_neumorphic_plus: ^3.2.0
  vibration: ^3.1.8
  percent_indicator: ^4.2.3
  flutter_riverpod: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
