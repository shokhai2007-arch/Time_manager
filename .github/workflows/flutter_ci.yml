name: Flutter CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze --verbose

      - name: Run tests
        run: flutter test --verbose

      - name: Build APK
        run: flutter build apk --debug

      - name: Generate Release Notes
        run: |
          echo "## Neumorphic Pitch Timer ⏱️" > release_notes.md
          echo "" >> release_notes.md
          echo "Ushbu versiya avtomatik ravishda GitHub Actions orqali yaratildi." >> release_notes.md
          echo "" >> release_notes.md
          echo "**So'nggi o'zgarishlar:**" >> release_notes.md
          git log -1 --pretty=format:"- %s (%h)" >> release_notes.md
          echo "" >> release_notes.md
          echo "" >> release_notes.md
          echo "Ilovani (APK) yuklab olish uchun quyidagi aktivlardan foydalaning." >> release_notes.md

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "Neumorphic Pitch Timer (Build ${{ github.run_number }})"
          body_path: release_notes.md
          files: build/app/outputs/flutter-apk/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
